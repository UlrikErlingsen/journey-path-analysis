    <circle cx="91" cy="83" r="8" fill="#D95B40"/>
  </g>
  <text x="222" y="136" fill="#F8F5ED" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Trace<tspan fill="#F2C66D">Signal</tspan></text>
  <text x="226" y="192" fill="#D7E3DF" font-family="Inter,Arial,sans-serif" font-size="25">Where do journeys flow, stall, and end?</text>
